<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DN Electronics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink-900: #10192B;
            --ink-500: #47536B;
            --ink-300: #8892A6;
            --line: #E4E8F0;
            --surface: #FFFFFF;
            --bg-soft: #F3F5F9;
            --navy: #16233F;
            --navy-dark: #0D1729;
            --gold: #C6981F;
            --gold-light: #E8C766;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 15% 15%, #1C2C4C 0%, #0D1729 55%, #0A121F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            background: var(--surface);
            padding: 48px;
            border-radius: 18px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 24px 60px rgba(6, 10, 20, 0.45);
            border: 1px solid var(--line);
            position: relative;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .logo {
            width: 42px;
            height: 42px;
            background: var(--navy);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--gold-light);
            font-size: 19px;
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--ink-900);
        }

        .brand-name span {
            color: var(--gold);
        }

        h2 {
            color: var(--ink-900);
            font-size: 24px;
            font-weight: 700;
            margin: 24px 0 6px;
            text-align: center;
            letter-spacing: -0.01em;
        }

        .subtitle {
            text-align: center;
            color: var(--ink-300);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            color: var(--ink-500);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: var(--bg-soft);
            color: var(--ink-900);
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(198, 152, 31, 0.15);
        }

        .form-group input::placeholder {
            color: var(--ink-300);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--navy);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 24px;
            font-family: inherit;
            box-shadow: 0 6px 18px rgba(22, 35, 63, 0.28);
        }

        .submit-btn:hover {
            background: var(--navy-dark);
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(22, 35, 63, 0.35);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .form-links {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }

        .form-links p {
            color: var(--ink-500);
            font-size: 14px;
        }

        .form-links a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .form-links a:hover {
            color: #A87E17;
            text-decoration: underline;
        }

        .divider {
            margin: 24px 0;
            text-align: center;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--line);
        }

        .divider span {
            background: var(--surface);
            padding: 0 16px;
            color: var(--ink-300);
            font-size: 14px;
        }

        .messages {
            margin-top: 16px;
        }

        .messages p {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            background: #FDF2F2;
            color: #B3261E;
            border: 1px solid #F5C6C6;
        }

        .terms {
            margin-top: 22px;
            text-align: center;
            font-size: 12px;
            color: var(--ink-300);
            line-height: 1.6;
        }

        .terms a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 32px 24px;
                margin: 10px;
                border-radius: 14px;
            }

            h2 {
                font-size: 22px;
            }

            .form-group input {
                padding: 12px 14px;
            }

            .submit-btn {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="brand">
            <span class="brand-name">DN<span>ELECTRONICS</span></span>
        </div>
        <form method="POST">
            {% csrf_token %}
            <h2>Create your account</h2>
            <p class="subtitle">Join us to start shopping smarter</p>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="submit-btn">Register</button>

            <div class="form-links">
                <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
            </div>

           <div class="terms">
    By continuing you agree with our
    <a href="{% url 'terms_conditions' %}">Terms &amp; Conditions</a>
    and confirm that you have read our
    <a href="{% url 'privacy_policy' %}">Privacy Policy</a>.
</div>

            {% for message in messages %}
                <div class="messages">
                    <p>{{ message }}</p>
                </div>
            {% endfor %}
        </form>
    </div>
</body>
</html>
